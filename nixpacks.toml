# Nixpacks configuration for Railway deployment

[phases.setup]
# postgresql_18 provides `pg_dump` for the nightly DB backup job. It must be
# >= the Railway Postgres server major (currently 18) or pg_dump refuses to run.
nixPkgs = ['nodejs_20', 'postgresql_18']

[phases.install]
cmds = [
  # --include=dev is required: Railway sets NODE_ENV=production, which would
  # otherwise omit devDependencies, but the build (tsc + @types/*) needs them.
  '(cd server && npm ci --include=dev)'
]

[phases.build]
cmds = [
  '(cd server && npm run build)'
]

[start]
cmd = 'cd server && npm start'
